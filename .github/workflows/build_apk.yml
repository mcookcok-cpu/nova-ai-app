name: Build NOVA-AI Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install Cordova
        run: |
          npm install -g cordova@12

      - name: Add Cordova Android platform
        run: |
          cordova platform add android@12.0.1
          cordova prepare android

      - name: Build Debug APK
        run: |
          cordova build android --debug || (echo "Build failed, checking folder structure..." && ls -R platforms/android && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14